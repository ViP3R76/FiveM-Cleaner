name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: FiveM CLEANER bauen
        run: dotnet publish FiveMCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false -p:Version=1.0.0 -o publish

      - name: Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-Cleaner-win-x64
          path: publish/*.exe
          if-no-files-found: error
